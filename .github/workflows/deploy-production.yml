# VPS_APP_PATH secret corrected to /var/www/myhomeusb/app
name: Deploy to Hostinger VPS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect what changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Skip the frontend build only when every changed file is under backend/.
          # Manual runs, new branches and force-pushes (BEFORE missing/unfetchable) always build.
          frontend=true
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git fetch -q --depth=1 origin "$BEFORE"; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Changed files:"; echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^backend/'; then
              frontend=false
            fi
          fi
          echo "Frontend build needed: $frontend"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build with production env
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        env:
          CI: false
          # Don't publish .map files - they expose the full frontend source and slow the build/upload
          GENERATE_SOURCEMAP: false
        run: |
          echo "REACT_APP_BACKEND_URL=https://construction.drawlead.com" > .env
          yarn build

      - name: Update backend code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            echo "==> Pulling latest main (backend code)"
            git fetch --all
            git reset --hard origin/main

            echo "==> Installing backend deps"
            cd backend
            if [ ! -d venv ]; then
              echo "No venv found, creating one"
              python3 -m venv venv
            fi
            venv/bin/pip install -r requirements.txt || true
            cd ..

            # One line so script_stop can't abort on the else branch; keep the old build when no new one is uploaded
            if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then echo "==> Preparing fresh build directory"; rm -rf frontend/build; else echo "==> Backend-only change: keeping existing frontend build"; fi

      - name: Copy built frontend to VPS
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/build/"
          target: "${{ secrets.VPS_APP_PATH }}"
          overwrite: true

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Restoring production frontend .env on VPS"
            echo "REACT_APP_BACKEND_URL=https://construction.drawlead.com" > frontend/.env

            echo "==> Ensuring swap exists (OOM protection)"
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi

            if [ ! -f backend/.env ]; then
              echo "WARNING: backend/.env is missing - backend will crash without MONGO_URL/DB_NAME"
            fi

            echo "==> Starting or restarting PM2 backend"
            if pm2 describe backend > /dev/null 2>&1; then
              echo "backend process found, restarting"
              pm2 restart backend --update-env
            else
              echo "No backend process registered in PM2, starting it"
              pm2 start "$PWD/backend/venv/bin/uvicorn" --name backend --interpreter none --cwd "$PWD/backend" --max-restarts 10 --restart-delay 5000 -- main:app --host 0.0.0.0 --port 8001
            fi
            pm2 save

            echo "==> Syncing build to the folder nginx actually serves"
            NGINX_ROOT=$(nginx -T 2>/dev/null | awk '/^[[:space:]]*server[[:space:]]*\{/ {sn=0; r=""} /server_name/ && /construction\.drawlead\.com/ {sn=1} $1=="root" {gsub(/;/,"",$2); r=$2} sn && r!="" {print r; exit}')
            echo "nginx root for construction.drawlead.com: ${NGINX_ROOT:-<not found>}"
            if [ -n "$NGINX_ROOT" ] && [ "$NGINX_ROOT" != "$PWD/frontend/build" ] && [ -f "$NGINX_ROOT/index.html" ]; then
              cp -a frontend/build/. "$NGINX_ROOT"/
              echo "Copied new build into $NGINX_ROOT"
            else
              echo "No separate nginx root to sync (or it has no index.html) - skipping"
            fi

            echo "==> Removing source maps left by earlier builds (cp never deletes old files)"
            if [ -n "$NGINX_ROOT" ] && [ -d "$NGINX_ROOT/static" ]; then echo "Deleted $(find "$NGINX_ROOT/static" -type f -name '*.map' -print -delete | wc -l) .map file(s) from $NGINX_ROOT/static"; fi

            echo "==> Verifying deployment"
            ls frontend/build/index.html
            pm2 status
            echo "--- Backend health (local) ---"
            # Poll up to 30s instead of a fixed sleep; kept on one line so script_stop can't abort mid-loop
            for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8001/api/auth/setup-status && break; sleep 1; done; echo "health check attempts: $i"
            curl -s -o /dev/null -w "setup-status HTTP %{http_code}\n" http://127.0.0.1:8001/api/auth/setup-status || echo "backend not responding on 8001"
            pm2 logs backend --lines 30 --nostream || true
            echo "--- nginx web roots (must match $PWD/frontend/build) ---"
            grep -Rn "server_name\|root " /etc/nginx/sites-enabled/ || true
            echo "===DEPLOY COMPLETE==="
