# VPS_APP_PATH secret corrected to /var/www/myhomeusb/app
name: Deploy to Hostinger VPS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build with production env
        working-directory: frontend
        env:
          CI: false
        run: |
          echo "REACT_APP_BACKEND_URL=https://construction.drawlead.com" > .env
          yarn build

      - name: Update backend code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            echo "==> Pulling latest main (backend code)"
            git fetch --all
            git reset --hard origin/main

            echo "==> Installing backend deps"
            cd backend
            if [ ! -d venv ]; then
              echo "No venv found, creating one"
              python3 -m venv venv
            fi
            venv/bin/pip install -r requirements.txt || true
            cd ..

            echo "==> Preparing fresh build directory"
            rm -rf frontend/build

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/build/"
          target: "${{ secrets.VPS_APP_PATH }}"
          overwrite: true

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "==> Restoring production frontend .env on VPS"
            echo "REACT_APP_BACKEND_URL=https://construction.drawlead.com" > frontend/.env

            echo "==> Ensuring swap exists (OOM protection)"
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi

            if [ ! -f backend/.env ]; then
              echo "WARNING: backend/.env is missing - backend will crash without MONGO_URL/DB_NAME"
            fi

            echo "==> Starting or restarting PM2 backend"
            if pm2 describe backend > /dev/null 2>&1; then
              echo "backend process found, restarting"
              pm2 restart backend --update-env
            else
              echo "No backend process registered in PM2, starting it"
              pm2 start "$PWD/backend/venv/bin/uvicorn" --name backend --interpreter none --cwd "$PWD/backend" --max-restarts 10 --restart-delay 5000 -- main:app --host 0.0.0.0 --port 8001
            fi
            pm2 save

            echo "==> Verifying deployment"
            ls frontend/build/index.html
            pm2 status
            sleep 10
            echo "--- Backend health (local) ---"
            curl -s -o /dev/null -w "setup-status HTTP %{http_code}\n" http://127.0.0.1:8001/api/auth/setup-status || echo "backend not responding on 8001"
            pm2 logs backend --lines 30 --nostream || true
            echo "--- nginx web roots (must match $PWD/frontend/build) ---"
            grep -Rn "server_name\|root " /etc/nginx/sites-enabled/ || true
            echo "===DEPLOY COMPLETE==="
